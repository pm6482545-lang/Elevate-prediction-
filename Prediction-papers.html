<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Papers - Elevate Kenya Predictions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b1329;
            color: #ffffff;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.15);
        }
    </style>
</head>
<body class="bg-[#070b19] text-gray-100 antialiased min-h-screen flex flex-col justify-between">

    <!-- Navigation Bar -->
    <nav class="sticky top-0 z-50 bg-[#070b19]/90 backdrop-blur-md border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <img src="logo.png" alt="Logo" class="h-10 w-10 object-contain">
                <span class="font-extrabold text-sm sm:text-base tracking-wider text-white">ELEVATE KENYA</span>
            </a>
            <a href="index.html" class="text-amber-400 font-bold text-sm hover:underline flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
        <div class="text-center max-w-3xl mx-auto mb-10">
            <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight text-white mb-4">NATIONAL PREDICTION PAPERS</h1>
            <p class="text-gray-300 text-sm sm:text-base">
                Select your national examination tier below to filter and download verified LaTeX-compiled assessment models.
            </p>
        </div>

        <!-- Filter Buttons (KPSEA, KJSEA, KCSE) -->
        <div class="flex flex-wrap justify-center gap-4 mb-12">
            <button onclick="filterPapers('kpsea')" id="btn-kpsea" class="filter-btn px-6 py-3 rounded-xl font-bold text-sm bg-amber-500 text-black shadow-[0_0_20px_rgba(245,158,11,0.3)] transition-all">
                KPSEA (Primary)
            </button>
            <button onclick="filterPapers('kjsea')" id="btn-kjsea" class="filter-btn px-6 py-3 rounded-xl font-bold text-sm bg-[#0b1329] text-amber-400 border border-amber-500/50 hover:bg-white/10 transition-all">
                KJSEA (Junior School)
            </button>
            <button onclick="filterPapers('kcse')" id="btn-kcse" class="filter-btn px-6 py-3 rounded-xl font-bold text-sm bg-[#0b1329] text-amber-400 border border-amber-500/50 hover:bg-white/10 transition-all">
                KCSE (Senior School)
            </button>
        </div>

        <!-- Files Display Grid -->
        <div id="fileContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-gray-400">
                <i class="fa-solid fa-spinner fa-spin text-3xl text-amber-400 mb-3"></i>
                <p>Loading papers from Supabase...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-[#050814] border-t border-white/10 py-8 text-center text-xs text-gray-500">
        <p>&copy; 2026 Elevate Kenya Predictions. All Rights Reserved.</p>
    </footer>

    <!-- Supabase CDN & Logic -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentCategory = 'kpsea';

        async function fetchPapers(category) {
            currentCategory = category;
            const container = document.getElementById('fileContainer');
            
            // Highlight active button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-amber-500', 'text-black', 'shadow-[0_0_20px_rgba(245,158,11,0.3)]');
                btn.classList.add('bg-[#0b1329]', 'text-amber-400', 'border', 'border-amber-500/50');
            });
            const activeBtn = document.getElementById(`btn-${category}`);
            activeBtn.classList.remove('bg-[#0b1329]', 'text-amber-400', 'border', 'border-amber-500/50');
            activeBtn.classList.add('bg-amber-500', 'text-black', 'shadow-[0_0_20px_rgba(245,158,11,0.3)]');

            container.innerHTML = `
                <div class="col-span-full text-center py-12 text-gray-400">
                    <i class="fa-solid fa-spinner fa-spin text-3xl text-amber-400 mb-3"></i>
                    <p>Fetching ${category.toUpperCase()} records...</p>
                </div>
            `;

            // Query Supabase table matching category
            const { data: files, error } = await supabase
                .from('files')
                .select('*')
                .eq('exam_category', category)
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<div class="col-span-full text-center text-red-400 py-8">Error loading files: ${error.message}</div>`;
                return;
            }

            if (!files || files.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 glass-card rounded-2xl p-8">
                        <i class="fa-solid fa-folder-open text-4xl text-amber-400/50 mb-3"></i>
                        <p class="text-gray-300 font-semibold">No prediction papers uploaded for ${category.toUpperCase()} yet.</p>
                    </div>
                `;
                return;
            }

            // Render file list cards
            container.innerHTML = files.map(file => `
                <div class="glass-card rounded-2xl p-6 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <span class="px-3 py-1 bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-bold uppercase rounded-full">
                                ${file.exam_category} ${file.grade ? '• ' + file.grade : ''}
                            </span>
                            <span class="text-xs text-gray-400">${file.subject || ''}</span>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-2 truncate" title="${file.file_name}">${file.file_name}</h3>
                        <p class="text-xs text-gray-400 mb-6">Uploaded: ${new Date(file.created_at).toLocaleDateString()}</p>
                    </div>
                    <a href="${file.file_url}" target="_blank" download class="w-full text-center bg-amber-500 hover:bg-amber-400 text-black font-bold py-3 rounded-xl transition-all flex items-center justify-center gap-2 text-sm shadow-md">
                        <i class="fa-solid fa-download"></i> Download Paper
                    </a>
                </div>
            `).join('');
        }

        function filterPapers(category) {
            fetchPapers(category);
        }

        // Load default on page open
        fetchPapers('kpsea');
    </script>
</body>
</html>
